
name: TWICE Shorts Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover TWICE uploads and generate ideas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run discovery engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/discover.py

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: twice-discovery-report
          path: reports/discovery.json
          if-no-files-found: error
          retention-days: 7
